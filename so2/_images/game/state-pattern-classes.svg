<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" width="1040" height="770" role="img" aria-labelledby="title desc">
<title id="title">State Pattern: klassen en bewaarde referenties</title>
<desc id="desc">Game1 bewaart één actieve AbstractState. Elke state heeft één Game1 als Context. MenuState, PlayState en PauseState erven van AbstractState. PauseState bewaart één PlayState als previousState. Alleen de belangrijkste leden en bewaarde referenties zijn getoond.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#243345}
.title{font-size:24px;font-weight:650}
.subtitle{font-size:16px;fill:#53657a}
.class-name{font-size:20px;font-weight:650}
.member{font-family:Consolas,'Courier New',monospace;font-size:15px}
.label{font-size:16px;fill:#425873}
.small{font-size:14px;fill:#53657a}
.card{fill:#fff;stroke:#7489a3;stroke-width:1.7}
.rule{stroke:#aebccc;stroke-width:1}
.link{fill:none;stroke:#405a79;stroke-width:2;stroke-linejoin:round}
.context{fill:none;stroke:#8064a4;stroke-width:1.8;stroke-linejoin:round}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#405a79" stroke-width="1.8"/></marker>
<marker id="context-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8064a4" stroke-width="1.8"/></marker>
<marker id="inherit" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="#fff" stroke="#405a79" stroke-width="1.8"/></marker>
</defs><rect width="1040" height="770" fill="#fff"/>
<text class="title" x="30" y="37">Eén contract, drie concrete toestanden</text>
<text class="subtitle" x="30" y="65">Klassendiagram · kern van de oplossing na stap 5</text>
<g><rect class="card" x="30" y="100" width="400" height="225" rx="4"/><path d="M34 101 H426 Q429 101 429 104 V149 H31 V104 Q31 101 34 101Z" fill="#eaf1f9"/><text class="class-name" x="230" y="132" text-anchor="middle">Game1</text><line class="rule" x1="30" x2="430" y1="150" y2="150"/><text class="member" x="44" y="177">- _currentState : AbstractState</text><line class="rule" x1="30" x2="430" y1="193" y2="193"/><text class="member" x="44" y="219">+ ChangeState(next : AbstractState)</text><text class="member" x="44" y="244"># Update(gameTime)</text><text class="member" x="44" y="269"># Draw(gameTime)</text></g>
<g><rect class="card" x="610" y="100" width="400" height="225" rx="4"/><path d="M614 101 H1006 Q1009 101 1009 104 V149 H611 V104 Q611 101 614 101Z" fill="#f0eafa"/><text class="class-name" x="810" y="132" text-anchor="middle" font-style="italic">AbstractState</text><line class="rule" x1="610" x2="1010" y1="150" y2="150"/><text class="member" x="624" y="177"># Context : Game1 { get; }</text><line class="rule" x1="610" x2="1010" y1="193" y2="193"/><text class="member" x="624" y="219">+ Update(gameTime) {abstract}</text><text class="member" x="624" y="244">+ Draw(gameTime, spriteBatch) {abstract}</text><text class="member" x="624" y="269"># IsKeyDown(key) : bool</text></g>
<path class="link" d="M430 167 H610" marker-end="url(#arrow)"/>
<text class="label" x="520" y="154" text-anchor="middle">_currentState</text><text class="small" x="592" y="188">1</text>
<path class="context" d="M610 256 H430" marker-end="url(#context-arrow)"/>
<text class="label" x="520" y="242" text-anchor="middle">Context</text><text class="small" x="439" y="277">1</text>
<path class="link" d="M172.5 435 V385 H867.5 V435 M520 435 V385 M810 385 V325" marker-end="url(#inherit)"/>
<g><rect class="card" x="30" y="435" width="285" height="210" rx="4"/><path d="M34 436 H311 Q314 436 314 439 V484 H31 V439 Q31 436 34 436Z" fill="#eaf1f9"/><text class="class-name" x="172.5" y="467" text-anchor="middle">MenuState</text><line class="rule" x1="30" x2="315" y1="485" y2="485"/><text class="member" x="44" y="512">+ Update(gameTime)</text><text class="member" x="44" y="537">+ Draw(gameTime, spriteBatch)</text></g>
<g><rect class="card" x="375" y="435" width="290" height="210" rx="4"/><path d="M379 436 H661 Q664 436 664 439 V484 H376 V439 Q376 436 379 436Z" fill="#e8f4f0"/><text class="class-name" x="520" y="467" text-anchor="middle">PlayState</text><line class="rule" x1="375" x2="665" y1="485" y2="485"/><text class="member" x="389" y="512">- _enemyPositions : List&lt;Vector2&gt;</text><text class="member" x="389" y="537">- _elapsedTimeForSpawn : double</text><line class="rule" x1="375" x2="665" y1="553" y2="553"/><text class="member" x="389" y="579">+ Update(gameTime)</text><text class="member" x="389" y="604">+ Draw(gameTime, spriteBatch)</text></g>
<g><rect class="card" x="725" y="435" width="285" height="210" rx="4"/><path d="M729 436 H1006 Q1009 436 1009 439 V484 H726 V439 Q726 436 729 436Z" fill="#fff3de"/><text class="class-name" x="867.5" y="467" text-anchor="middle">PauseState</text><line class="rule" x1="725" x2="1010" y1="485" y2="485"/><text class="member" x="739" y="512">- _previousState : PlayState</text><line class="rule" x1="725" x2="1010" y1="528" y2="528"/><text class="member" x="739" y="554">+ Update(gameTime)</text><text class="member" x="739" y="579">+ Draw(gameTime, spriteBatch)</text></g>
<path class="link" d="M867.5 645 V694 H520 V645" marker-end="url(#arrow)"/>
<text class="label" x="694" y="683" text-anchor="middle">_previousState</text><text class="small" x="532" y="663">1</text>
<text class="small" x="30" y="738">Open driehoek: overerving · open pijl: navigeerbare referentie · cursief: abstracte klasse</text>
</svg>
